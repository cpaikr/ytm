[package]
name = "ytm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Standalone KIS-NET YTM Matrix command-line interface"
publish = false

[[bin]]
name = "ytm"
path = "src/main.rs"

[features]
judge-fixtures = ["ytm-core/judge-fixtures"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ytm-core = { path = "../ytm-core", version = "=0.2.0" }

[dev-dependencies]
pretty_assertions = "=1.4.1"
