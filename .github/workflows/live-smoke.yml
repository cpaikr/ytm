name: Live KIS-NET Smoke

on:
  schedule:
    - cron: "17 1 * * 1-5"
  workflow_dispatch:
    inputs:
      base_date:
        description: "Requested 기준일 in YYYY-MM-DD form; defaults to today"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-kisnet-smoke
  cancel-in-progress: false

jobs:
  rust-cli:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Build standalone Rust CLI
        run: cargo build --locked -p ytm-cli

      - name: Run live smoke
        shell: bash
        env:
          INPUT_BASE_DATE: ${{ inputs.base_date }}
        run: |
          BASE_DATE=${INPUT_BASE_DATE:-$(date -u +%F)}
          RESULT=$(target/debug/ytm matrix \
            --base-date "$BASE_DATE" \
            --kind 국채 \
            --fallback previous-available \
            --lookback-days 10)
          jq -e '.ok == true and (.result.rows | length > 0)' <<<"$RESULT" >/dev/null
          RESOLVED_DATE=$(jq -r '.result.baseDate' <<<"$RESULT")
          COUNT=$(jq -r '.result.rows | length' <<<"$RESULT")
          echo "KIS-NET metadata smoke passed: requested=$BASE_DATE resolved=$RESOLVED_DATE rows=$COUNT"
