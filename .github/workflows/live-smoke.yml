name: Live KIS-NET Smoke

on:
  schedule:
    - cron: "17 1 * * 1-5"
  workflow_dispatch:
    inputs:
      base_date:
        description: "Requested 기준일 in YYYY-MM-DD form; defaults to today"
        required: false
        type: string
      kind:
        description: "KIS-NET 종류 code or label"
        required: false
        default: "국채"
        type: string
      previous_available_days:
        description: "Maximum earlier calendar days to probe"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: live-kisnet-smoke
  cancel-in-progress: false

jobs:
  node:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build Node product
        run: bun run build:node

      - name: Run live smoke
        shell: bash
        env:
          INPUT_BASE_DATE: ${{ inputs.base_date }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_LOOKBACK: ${{ inputs.previous_available_days }}
        run: |
          BASE_DATE=${INPUT_BASE_DATE:-$(date -u +%F)}
          KIND=${INPUT_KIND:-국채}
          LOOKBACK=${INPUT_LOOKBACK:-10}
          node packages/node/dist/cli.js matrix \
            --base-date "$BASE_DATE" \
            --kind "$KIND" \
            --fallback previous-available \
            --lookback-days "$LOOKBACK" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(!p.ok||!p.result?.rows?.length)process.exit(1);console.log(`KIS-NET smoke passed: requested=${p.result.requestedBaseDate} resolved=${p.result.baseDate} rows=${p.result.rows.length}`)})'
