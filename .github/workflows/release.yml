name: Release product

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact approved stable product version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.expected_version }}
  cancel-in-progress: false

jobs:
  release_authority:
    name: Resolve approved release authority
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.expected_version }}
    permissions:
      # Create the exact immutable tag and its recoverable draft Release.
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      release_url: ${{ steps.resolve.outputs.release_url }}
      publication_mode: ${{ steps.resolve.outputs.publication_mode }}

    steps:
      - name: Check out submitted source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Validate approved version and classify release state
        id: state
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun run release:version:check
          node scripts/resolve-release-state.mjs inspect

      - name: Create exact immutable tag and draft
        if: steps.state.outputs.mode == 'create' || steps.state.outputs.mode == 'create_draft'
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ steps.state.outputs.mode }}
        run: node scripts/create-release-draft.mjs

      - name: Resolve immutable release identity
        id: resolve
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ steps.state.outputs.mode }}
        run: node scripts/resolve-release-state.mjs resolve

  cli_metadata:
    name: Standalone CLI matrix
    needs: release_authority
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Emit CLI target matrix
        id: targets
        shell: bash
        run: echo "matrix=$(node scripts/print-cli-matrix.mjs)" >> "$GITHUB_OUTPUT"

  cli_archive:
    name: CLI archive (${{ matrix.key }})
    needs: [release_authority, cli_metadata]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli_metadata.outputs.matrix) }}
    env:
      RUST_TARGET: ${{ matrix.rust }}
      SOURCE_COMMIT: ${{ needs.release_authority.outputs.source_sha }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Install pinned Linux native build toolchain
        if: matrix.usesGlibcFloor
        run: node scripts/install-linux-native-toolchain.mjs
      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"
      - name: Build standalone CLI artifact
        run: node scripts/build-cli-artifact.mjs "$RUST_TARGET"
      - name: Validate Linux CLI glibc floor
        if: matrix.usesGlibcFloor
        run: node scripts/validate-cli-glibc.mjs "$RUST_TARGET"
      - name: Assemble and inspect standalone CLI archive
        run: |
          node scripts/assemble-cli-archive.mjs "$RUST_TARGET" .artifacts/cli --source-commit "$SOURCE_COMMIT"
          node scripts/validate-cli-archive.mjs "$RUST_TARGET" .artifacts/cli --execute
      - name: Upload standalone CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-${{ matrix.key }}-${{ needs.release_authority.outputs.source_sha }}
          path: .artifacts/cli/*
          if-no-files-found: error
          retention-days: 1

  cli_artifact_set:
    name: Complete standalone CLI candidate
    needs: [release_authority, cli_archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download standalone CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cli-*-${{ needs.release_authority.outputs.source_sha }}
          path: dist/cli
          merge-multiple: true
      - name: Generate and validate complete CLI candidate
        run: |
          node scripts/generate-cli-installers.mjs dist/cli
          node scripts/finalize-cli-artifacts.mjs dist/cli
          node scripts/validate-cli-artifact-set.mjs dist/cli
      - name: Upload complete CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-candidate-${{ needs.release_authority.outputs.source_sha }}
          path: dist/cli/*
          if-no-files-found: error
          retention-days: 90

  cli_consumer:
    name: Standalone CLI consumer (${{ matrix.key }})
    needs: [release_authority, cli_metadata, cli_artifact_set]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli_metadata.outputs.matrix) }}
    env:
      RUST_TARGET: ${{ matrix.rust }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Download exact complete CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-candidate-${{ needs.release_authority.outputs.source_sha }}
          path: dist/cli
      - name: Test exact standalone CLI consumer
        run: node scripts/test-cli-release-consumer.mjs dist/cli

  native_packages:
    name: Native package (${{ matrix.target.rust }})
    needs: release_authority
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - rust: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            directory: linux-x64-gnu
          - rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            directory: linux-arm64-gnu
          - rust: aarch64-apple-darwin
            runner: macos-15
            directory: darwin-arm64
          - rust: x86_64-pc-windows-msvc
            runner: windows-2025
            directory: win32-x64-msvc
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned Linux native build toolchain
        if: matrix.target.rust == 'x86_64-unknown-linux-gnu' || matrix.target.rust == 'aarch64-unknown-linux-gnu'
        run: node scripts/install-linux-native-toolchain.mjs
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}
      - name: Build native artifact
        run: node scripts/build-native-artifact.mjs ${{ matrix.target.rust }}
      - name: Validate Linux artifact glibc floor
        if: matrix.target.rust == 'x86_64-unknown-linux-gnu' || matrix.target.rust == 'aarch64-unknown-linux-gnu'
        run: node scripts/validate-native-artifact.mjs ${{ matrix.target.rust }}
      - name: Assemble and pack native package
        shell: bash
        run: |
          node scripts/generate-native-packages.mjs
          node scripts/assemble-native-package.mjs ${{ matrix.target.rust }}
          mkdir -p .artifacts
          npm pack --pack-destination .artifacts packages/native/${{ matrix.target.directory }}
      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.target.directory }}-${{ needs.release_authority.outputs.source_sha }}
          path: .artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  root_package:
    name: Root Node SDK package
    needs: release_authority
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned validation tools
        run: |
          cargo install --locked --features cli cargo-about --version 0.9.2
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.19.0
      - name: Validate immutable source
        run: bun run validate
      - name: Pack root package without a native binary
        shell: bash
        run: |
          bun run build:facade
          mkdir -p .artifacts
          npm pack --pack-destination .artifacts --workspace packages/node
      - name: Upload root package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: root-${{ needs.release_authority.outputs.source_sha }}
          path: .artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  npm_candidate:
    name: Complete npm candidate
    needs: [release_authority, native_packages, root_package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-*-${{ needs.release_authority.outputs.source_sha }}
          path: dist/native
          merge-multiple: true
      - name: Download root package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: root-${{ needs.release_authority.outputs.source_sha }}
          path: dist/root
      - name: Validate complete npm artifact set
        run: node scripts/validate-release-artifacts.mjs dist/native dist/root
      - name: Upload complete npm candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-candidate-${{ needs.release_authority.outputs.source_sha }}
          path: |
            dist/native/*.tgz
            dist/root/*.tgz
          if-no-files-found: error
          retention-days: 90

  npm_consumer:
    name: Exact npm consumer (${{ matrix.target.rust }} / Node ${{ matrix.node }})
    needs: [release_authority, npm_candidate]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        target:
          - rust: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x64
          - rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: arm64
          - rust: aarch64-apple-darwin
            runner: macos-15
            arch: arm64
          - rust: x86_64-pc-windows-msvc
            runner: windows-2025
            arch: x64
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.arch }}
          package-manager-cache: false
      - name: Download exact complete npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-candidate-${{ needs.release_authority.outputs.source_sha }}
          path: dist
      - name: Test exact aggregated Node SDK consumer
        run: node scripts/test-native-consumer.mjs ${{ matrix.target.rust }} dist/native dist/root

  publish_github:
    name: Publish canonical GitHub Release
    needs: [release_authority, cli_artifact_set, cli_consumer, npm_candidate, npm_consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: ${{ needs.release_authority.outputs.release_url }}
    permissions:
      # Upload canonical assets and publish the verified draft Release.
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release_authority.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release_authority.outputs.version }}
      RELEASE_SHA: ${{ needs.release_authority.outputs.source_sha }}
      RELEASE_ID: ${{ needs.release_authority.outputs.release_id }}
      RELEASE_MODE: ${{ needs.release_authority.outputs.publication_mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download exact complete CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-candidate-${{ needs.release_authority.outputs.source_sha }}
          path: dist/cli
      - name: Download exact complete npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-candidate-${{ needs.release_authority.outputs.source_sha }}
          path: dist/npm
      - name: Validate tagged candidates and source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
          node scripts/validate-product-version.mjs
          node scripts/validate-cli-artifact-set.mjs dist/cli
          node scripts/validate-release-artifacts.mjs dist/npm/native dist/npm/root
      - name: Use pinned npm for registry preflight
        run: npm install --global npm@11.6.2
      - name: Prove every npm version is absent
        shell: bash
        run: |
          registry_error=$(mktemp)
          trap 'rm -f "$registry_error"' EXIT
          for tarball in dist/npm/native/*.tgz dist/npm/root/*.tgz; do
            package_name=$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).name))')
            package_version=$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')
            if npm view "$package_name@$package_version" version >/dev/null 2>"$registry_error"; then
              echo "$package_name@$package_version already exists; approve a new version instead of repairing publication in place." >&2
              exit 1
            fi
            if ! grep -q 'E404' "$registry_error"; then
              cat "$registry_error" >&2
              echo "Could not prove $package_name@$package_version is absent from npm." >&2
              exit 1
            fi
            : > "$registry_error"
          done
      - name: Reconcile canonical assets without replacement
        id: assets
        shell: bash
        run: |
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          expected_draft=true
          if [ "$RELEASE_MODE" = project ]; then expected_draft=false; fi
          jq -e --arg tag "$RELEASE_TAG" --argjson draft "$expected_draft" '
            (.tag_name == $tag) and (.draft == $draft) and (.prerelease == false) and
            (.assets | type == "array")
          ' <<<"$release_json" >/dev/null
          mkdir -p dist/current-release
          if [ "$(jq '.assets | length' <<<"$release_json")" -gt 0 ]; then
            gh release download "$RELEASE_TAG" --dir dist/current-release
          fi
          plan=$(node scripts/plan-cli-release-upload.mjs dist/cli dist/current-release)
          if [ "$RELEASE_MODE" = project ]; then
            jq -e '.missing | length == 0' <<<"$plan" >/dev/null
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - name: Upload only missing CLI assets
        if: env.RELEASE_MODE != 'project'
        shell: bash
        env:
          UPLOAD_PLAN: ${{ steps.assets.outputs.plan }}
        run: |
          jq -r '.missing[]' <<<"$UPLOAD_PLAN" | while IFS= read -r asset; do
            gh release upload "$RELEASE_TAG" "dist/cli/$asset"
          done
      - name: Re-download and verify canonical assets
        shell: bash
        run: |
          mkdir -p dist/verified-release
          gh release download "$RELEASE_TAG" --dir dist/verified-release
          plan=$(node scripts/plan-cli-release-upload.mjs dist/cli dist/verified-release)
          jq -e '.missing | length == 0' <<<"$plan" >/dev/null
          node scripts/validate-cli-artifact-set.mjs dist/verified-release
      - name: Revalidate immutable Release metadata
        shell: bash
        run: |
          visibility=draft
          if [ "$RELEASE_MODE" = project ]; then visibility=public; fi
          EXPECTED_RELEASE_VISIBILITY="$visibility" node scripts/verify-release-metadata.mjs
      - name: Publish canonical GitHub Release
        if: env.RELEASE_MODE != 'project'
        shell: bash
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true >/dev/null
      - name: Verify canonical GitHub Release is public
        shell: bash
        run: |
          EXPECTED_RELEASE_VISIBILITY=public node scripts/verify-release-metadata.mjs
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e --arg tag "$RELEASE_TAG" '
            (.tag_name == $tag) and (.draft == false) and (.prerelease == false) and
            (.html_url == "${{ needs.release_authority.outputs.release_url }}")
          ' <<<"$published" >/dev/null

  publish_npm:
    name: Publish synchronized npm projection
    needs: [release_authority, npm_candidate, publish_github]
    # npm Trusted Publishing does not support self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/@sjunepark/ytm/v/${{ needs.release_authority.outputs.version }}
    permissions:
      contents: read
      # Exchange the GitHub job identity for npm trusted-publishing credentials.
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release_authority.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release_authority.outputs.version }}
      RELEASE_SHA: ${{ needs.release_authority.outputs.source_sha }}
      RELEASE_ID: ${{ needs.release_authority.outputs.release_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release_authority.outputs.source_sha }}
      - name: Download exact complete npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-candidate-${{ needs.release_authority.outputs.source_sha }}
          path: dist
      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use pinned npm with trusted publishing support
        run: |
          npm install --global npm@11.6.2
          npm --version
      - name: Verify canonical release and exact npm candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
          EXPECTED_RELEASE_VISIBILITY=public node scripts/verify-release-metadata.mjs
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e --arg tag "$RELEASE_TAG" '(.tag_name == $tag) and (.draft == false) and (.prerelease == false)' <<<"$release_json" >/dev/null
          node scripts/validate-release-artifacts.mjs dist/native dist/root
      - name: Re-prove every npm version is absent
        shell: bash
        run: |
          registry_error=$(mktemp)
          trap 'rm -f "$registry_error"' EXIT
          for tarball in dist/native/*.tgz dist/root/*.tgz; do
            package_name=$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).name))')
            package_version=$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')
            if npm view "$package_name@$package_version" version >/dev/null 2>"$registry_error"; then
              echo "$package_name@$package_version already exists; npm projection cannot repair a partial version." >&2
              exit 1
            fi
            if ! grep -q 'E404' "$registry_error"; then
              cat "$registry_error" >&2
              echo "Could not prove $package_name@$package_version is absent from npm." >&2
              exit 1
            fi
            : > "$registry_error"
          done
      - name: Publish native packages, then root package
        shell: bash
        run: |
          published=()
          mapfile -t root_tarballs < <(find dist/root -maxdepth 1 -type f -name '*.tgz' -print | sort)
          if [ "${#root_tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one root package tarball; found ${#root_tarballs[@]}." >&2
            exit 1
          fi
          publish_one() {
            local tarball=$1
            local package_name
            if ! package_name=$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const name=JSON.parse(s).name;if(typeof name!=="string"||!name)process.exit(1);process.stdout.write(name)})'); then
              {
                echo "### npm projection incomplete"
                echo
                echo "Canonical GitHub Release $RELEASE_TAG is public, but package identity could not be read from $tarball."
                echo "Published before the failure: ${published[*]:-none}. Approve a new version; do not repair this version in place."
              } >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            if npm publish "$tarball" --provenance --access public; then
              published+=("$package_name@$RELEASE_VERSION")
              return 0
            fi
            {
              echo "### npm projection incomplete"
              echo
              echo "Canonical GitHub Release $RELEASE_TAG is public, but npm failed at $package_name@$RELEASE_VERSION."
              echo "Published before the failure: ${published[*]:-none}. Approve a new version; do not repair this version in place."
            } >> "$GITHUB_STEP_SUMMARY"
            return 1
          }
          for tarball in dist/native/*.tgz; do
            publish_one "$tarball" || exit 1
          done
          publish_one "${root_tarballs[0]}" || exit 1
          echo "Published npm projection: ${published[*]}" >> "$GITHUB_STEP_SUMMARY"
