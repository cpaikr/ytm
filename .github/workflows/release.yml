name: Release npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing node-vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}
      package_version: ${{ steps.package.outputs.package_version }}
      source_sha: ${{ steps.package.outputs.source_sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release metadata
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_NAME=$(node -p "require('./packages/node/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./packages/node/package.json').version")
          SOURCE_SHA=$(git rev-parse HEAD)

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release publishing must be dispatched from main." >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "node-v$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match Node version node-v$PACKAGE_VERSION." >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "Tag $RELEASE_TAG does not point to a commit on main." >&2
            exit 1
          fi

          node scripts/generate-native-packages.mjs --check
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  native_packages:
    name: Native package (${{ matrix.target.rust }})
    needs: metadata
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - rust: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            directory: linux-x64-gnu
          - rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            directory: linux-arm64-gnu
          - rust: aarch64-apple-darwin
            runner: macos-15
            directory: darwin-arm64
          - rust: x86_64-pc-windows-msvc
            runner: windows-2025
            directory: win32-x64-msvc
    runs-on: ${{ matrix.target.runner }}

    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.source_sha }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}

      - name: Build native artifact
        run: cargo build --locked --release --target ${{ matrix.target.rust }} -p ytm-node

      - name: Assemble and pack native package
        shell: bash
        run: |
          node scripts/generate-native-packages.mjs
          node scripts/assemble-native-package.mjs ${{ matrix.target.rust }}
          node scripts/test-native-consumer.mjs ${{ matrix.target.rust }}
          mkdir -p .artifacts
          npm pack --pack-destination .artifacts packages/native/${{ matrix.target.directory }}

      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.target.directory }}-${{ needs.metadata.outputs.package_version }}
          path: .artifacts/*.tgz
          if-no-files-found: error

  root_package:
    runs-on: ubuntu-24.04
    needs: metadata
    timeout-minutes: 30

    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned license generator
        run: cargo install --locked --features cli cargo-about --version 0.9.2

      - name: Validate immutable source
        run: |
          bun run validate
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          bun run test:node
          bun run judge:broken

      - name: Pack root package without a native binary
        shell: bash
        run: |
          bun run build:facade
          mkdir -p .artifacts
          npm pack --pack-destination .artifacts --workspace packages/node

      - name: Upload root package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: root-${{ needs.metadata.outputs.package_version }}
          path: .artifacts/*.tgz
          if-no-files-found: error

  publish:
    # npm Trusted Publishing does not support self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - metadata
      - native_packages
      - root_package
    environment:
      name: npm
      url: https://www.npmjs.com/package/@sjunepark/ytm/v/${{ needs.metadata.outputs.package_version }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.source_sha }}

      - name: Download native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-*-${{ needs.metadata.outputs.package_version }}
          path: dist/native
          merge-multiple: true

      - name: Download root package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: root-${{ needs.metadata.outputs.package_version }}
          path: dist/root

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use pinned npm with trusted publishing support
        run: |
          npm install --global npm@11.6.2
          npm --version

      - name: Validate complete release artifact set
        run: node scripts/validate-release-artifacts.mjs dist/native dist/root

      - name: Reject an already-published version
        shell: bash
        run: |
          registry_error=$(mktemp)
          trap 'rm -f "$registry_error"' EXIT
          for tarball in dist/native/*.tgz dist/root/*.tgz; do
            package_name=$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).name))')
            package_version=$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')
            if npm view "$package_name@$package_version" version >/dev/null 2>"$registry_error"; then
              echo "$package_name@$package_version already exists; approve a new version instead of repairing a partial publish in place." >&2
              exit 1
            fi
            if ! grep -q 'E404' "$registry_error"; then
              cat "$registry_error" >&2
              echo "Could not prove $package_name@$package_version is absent from npm." >&2
              exit 1
            fi
            : > "$registry_error"
          done

      - name: Publish native packages, then root package
        shell: bash
        run: |
          for tarball in dist/native/*.tgz; do
            npm publish "$tarball" --access public
          done

          root_tarball=$(find dist/root -maxdepth 1 -name '*.tgz' -print)
          npm publish "$root_tarball" --access public
