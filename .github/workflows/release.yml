name: CLI release
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Select Python for workspace and wheel validation
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 11)'
          echo "PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Install pinned validation tools
        run: |
          cargo install --locked --features cli cargo-about --version 0.9.2
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.19.0
      - name: Verify version and tag identity
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |-
          node scripts/release-version.mjs check "$RELEASE_TAG"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Validate repository
        run: bun run validate
    name: Verify release source
    outputs:
      source_sha: ${{ github.sha }}
      version: ${{ steps.version.outputs.version }}
  cli_metadata:
    name: Standalone CLI matrix
    needs: verify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Emit CLI target matrix
        id: targets
        shell: bash
        run: echo "matrix=$(node scripts/print-cli-matrix.mjs)" >> "$GITHUB_OUTPUT"
  cli_archive:
    name: CLI archive (${{ matrix.key }})
    needs:
      - verify
      - cli_metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli_metadata.outputs.matrix) }}
    env:
      RUST_TARGET: ${{ matrix.rust }}
      SOURCE_COMMIT: ${{ needs.verify.outputs.source_sha }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Install pinned Linux native build toolchain
        if: matrix.usesGlibcFloor
        run: node scripts/install-linux-native-toolchain.mjs
      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"
      - name: Build standalone CLI artifact
        run: node scripts/build-cli-artifact.mjs "$RUST_TARGET"
      - name: Validate Linux CLI glibc floor
        if: matrix.usesGlibcFloor
        run: node scripts/validate-cli-glibc.mjs "$RUST_TARGET"
      - name: Assemble and inspect standalone CLI archive
        run: |
          node scripts/assemble-cli-archive.mjs "$RUST_TARGET" .artifacts/cli --source-commit "$SOURCE_COMMIT"
          node scripts/validate-cli-archive.mjs "$RUST_TARGET" .artifacts/cli --execute
      - name: Upload standalone CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-${{ matrix.key }}-${{ needs.verify.outputs.source_sha }}
          path: .artifacts/cli/*
          if-no-files-found: error
          retention-days: 1
  cli_artifact_set:
    name: Complete standalone CLI candidate
    needs:
      - verify
      - cli_archive
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download standalone CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cli-*-${{ needs.verify.outputs.source_sha }}
          path: dist/cli
          merge-multiple: true
      - name: Generate and validate complete CLI candidate
        run: |
          node scripts/generate-cli-installers.mjs dist/cli
          node scripts/finalize-cli-artifacts.mjs dist/cli
          node scripts/validate-cli-artifact-set.mjs dist/cli
      - name: Upload complete CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-candidate-${{ needs.verify.outputs.source_sha }}
          path: dist/cli/*
          if-no-files-found: error
          retention-days: 90
  cli_consumer:
    name: Standalone CLI consumer (${{ matrix.key }})
    needs:
      - verify
      - cli_metadata
      - cli_artifact_set
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli_metadata.outputs.matrix) }}
    env:
      RUST_TARGET: ${{ matrix.rust }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.source_sha }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Download exact complete CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-candidate-${{ needs.verify.outputs.source_sha }}
          path: dist/cli
      - name: Test exact standalone CLI consumer
        run: node scripts/test-cli-release-consumer.mjs dist/cli
  publish:
    name: Publish verified CLI release
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
    needs:
      - verify
      - cli_artifact_set
      - cli_consumer
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ needs.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download exact verified CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-candidate-${{ needs.verify.outputs.source_sha }}
          path: dist/cli
      - name: Publish immutable GitHub assets
        run: node scripts/publish-release.mjs dist/cli "$RELEASE_TAG"
      - name: Report interrupted publication
        if: failure()
        run: echo 'Publication failed. Inspect the GitHub Release and failed step. Retry the unchanged tag only when retained assets match; never move a tag or replace published assets. See docs/release.md.' >> "$GITHUB_STEP_SUMMARY"
