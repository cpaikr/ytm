name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/rewrite-vnext

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned license generator
        run: cargo install --locked --features cli cargo-about --version 0.9.2

      - name: Validate contracts, generated artifacts, and release configuration
        run: bun run contracts:check && bun run licenses:check && bun run release:check && bun run build:check

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Prove release builds reject judge fixtures
        run: bun run rust:fixture-guard

      - name: Install pinned Rust security checks
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.19.0

      - name: Audit Rust dependencies and policy
        run: |
          cargo audit
          cargo deny check

      - name: Build fixture-enabled product
        run: bun run build:judge

      - name: Run product conformance and kind 80 judge
        run: bun run judge

      - name: Prove judge sensitivity
        run: bun run judge:broken

      - name: Check npm package contents
        run: bun run pack:node

  native-consumer:
    name: Native consumer (${{ matrix.target.rust }} / Node ${{ matrix.node }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        target:
          - rust: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x64
          - rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: arm64
          - rust: aarch64-apple-darwin
            runner: macos-15
            arch: arm64
          - rust: x86_64-pc-windows-msvc
            runner: windows-2025
            arch: x64
    runs-on: ${{ matrix.target.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.arch }}
          package-manager-cache: false

      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}

      - name: Build production native artifact
        run: cargo build --locked --release --target ${{ matrix.target.rust }} -p ytm-node

      - name: Assemble product packages
        run: |
          node scripts/generate-native-packages.mjs
          node packages/node/scripts/build.mjs --facade-only
          node scripts/assemble-native-package.mjs ${{ matrix.target.rust }}

      - name: Test clean installed CLI and toolset
        run: node scripts/test-native-consumer.mjs ${{ matrix.target.rust }}
