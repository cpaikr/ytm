name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-candidate:
    needs: cli-metadata
    if: needs.cli-metadata.outputs.full == 'true'
    uses: ./.github/workflows/python-candidate.yml
    with:
      source_sha: ${{ github.sha }}

  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Select Python for workspace and wheel validation
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 11)'
          echo "PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Install pinned validation tools
        run: |
          cargo install --locked --features cli cargo-about --version 0.9.2
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.19.0

      - name: Validate repository
        run: bun run validate

  cli-metadata:
    name: Select platform coverage
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      native: ${{ steps.targets.outputs.native }}
      full: ${{ steps.targets.outputs.full }}

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Emit CLI target matrix
        id: targets
        shell: bash
        run: node scripts/ci-platform-policy.mjs

  cli-archive:
    name: CLI archive (${{ matrix.key }})
    needs: cli-metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli-metadata.outputs.matrix) }}
    env:
      RUST_TARGET: ${{ matrix.rust }}
      SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          package-manager-cache: false

      - name: Install pinned Linux native build toolchain
        if: matrix.usesGlibcFloor
        run: node scripts/install-linux-native-toolchain.mjs

      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"

      - name: Build standalone CLI artifact
        run: node scripts/build-cli-artifact.mjs "$RUST_TARGET"

      - name: Validate Linux CLI glibc floor
        if: matrix.usesGlibcFloor
        run: node scripts/validate-cli-glibc.mjs "$RUST_TARGET"

      - name: Assemble and inspect standalone CLI archive
        run: |
          node scripts/assemble-cli-archive.mjs "$RUST_TARGET" .artifacts/cli --source-commit "$SOURCE_COMMIT"
          node scripts/validate-cli-archive.mjs "$RUST_TARGET" .artifacts/cli --execute

      - name: Upload standalone CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-${{ matrix.key }}-${{ github.sha }}
          path: .artifacts/cli/*
          if-no-files-found: error
          retention-days: 1

  cli-artifact-set:
    name: Complete standalone CLI artifact set
    needs: [cli-metadata, cli-archive]
    if: needs.cli-metadata.outputs.full == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download standalone CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cli-*-${{ github.sha }}
          path: dist/cli
          merge-multiple: true

      - name: Generate and validate complete CLI candidate
        run: |
          node scripts/generate-cli-installers.mjs dist/cli
          node scripts/finalize-cli-artifacts.mjs dist/cli
          node scripts/validate-cli-artifact-set.mjs dist/cli

      - name: Upload complete CLI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-candidate-${{ github.sha }}
          path: dist/cli/*
          if-no-files-found: error
          retention-days: 7

  cli-consumer:
    if: needs.cli-metadata.outputs.full == 'true'
    name: Standalone CLI consumer (${{ matrix.key }})
    needs: [cli-metadata, cli-artifact-set]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli-metadata.outputs.matrix) }}
    env:
      RUST_TARGET: ${{ matrix.rust }}

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          package-manager-cache: false

      - name: Download exact complete CLI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-candidate-${{ github.sha }}
          path: dist/cli

      - name: Test exact standalone CLI consumer
        run: node scripts/test-cli-release-consumer.mjs dist/cli

  native-consumer:
    needs: cli-metadata
    name: Native consumer (${{ matrix.target.rust }} / Node ${{ matrix.node }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli-metadata.outputs.native) }}
    runs-on: ${{ matrix.target.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.arch }}
          package-manager-cache: false

      - name: Install pinned Linux native build toolchain
        if: matrix.target.rust == 'x86_64-unknown-linux-gnu' || matrix.target.rust == 'aarch64-unknown-linux-gnu'
        run: node scripts/install-linux-native-toolchain.mjs

      - name: Install Rust target
        run: rustup target add ${{ matrix.target.rust }}

      - name: Build production native artifact
        run: node scripts/build-native-artifact.mjs ${{ matrix.target.rust }}

      - name: Validate Linux artifact glibc floor
        if: matrix.target.rust == 'x86_64-unknown-linux-gnu' || matrix.target.rust == 'aarch64-unknown-linux-gnu'
        run: node scripts/validate-native-artifact.mjs ${{ matrix.target.rust }}

      - name: Assemble product packages
        shell: bash
        run: |
          node scripts/generate-native-packages.mjs
          npm run build:sdk
          node scripts/assemble-native-package.mjs ${{ matrix.target.rust }}
          mkdir -p .artifacts/native .artifacts/root
          npm pack --pack-destination .artifacts/native packages/native/${{ matrix.target.directory }}
          npm pack --pack-destination .artifacts/root --workspace packages/node

      - name: Test exact packed Node SDK
        run: node scripts/test-native-consumer.mjs ${{ matrix.target.rust }} .artifacts/native .artifacts/root

  platform-gate:
    name: Platform compatibility
    if: always()
    needs: [validate, cli-metadata, cli-archive, cli-artifact-set, cli-consumer, native-consumer, python-candidate]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require selected platform checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['NEEDS_JSON'])
          full = jobs['cli-metadata']['outputs'].get('full') == 'true'
          optional = {'cli-artifact-set', 'cli-consumer', 'python-candidate'}
          failed = [name for name, job in jobs.items()
                    if job['result'] != ('skipped' if not full and name in optional else 'success')]
          if failed:
              raise SystemExit('Platform gate failed: ' + ', '.join(failed))
          PYTHON
