[graph]
all-features = true

[advisories]
# Owner-approved on 2026-11-26: unmaintained notices with no maintained release
# to move to. None reports a vulnerability. Remove each entry once its
# dependency path is replaced.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained: direct ytm-core date dependency; migration to a maintained date crate is separate work" },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained: transitive through futures-util 0.3.31, the latest release" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained: test-only, through serde_yaml_ng 0.10.0, the latest release" },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
